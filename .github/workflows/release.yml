name: Release

# Publishes the GitHub release of a pushed tag vX.Y.Z with its CHANGELOG section. All
# logic is in scripts/publish-release.sh, which also runs by hand; an existing release is
# skipped. The manual start publishes a tag that exists already, e.g. after a failed run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag vX.Y.Z to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags, and the CHANGELOG of the tagged commit
          persist-credentials: false
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # The tag goes in as data, never as text of the command.
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: sh scripts/publish-release.sh "$TAG"
