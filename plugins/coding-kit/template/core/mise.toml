# Toolchain pins — fuzzy majors here, exact versions in mise.lock (generated by
# `mise lock`, committed). CI installs with --locked and needs a download URL for
# every platform in lockfile_platforms. The stack module adds its runtimes to [tools].
[tools]
just = "1"
lefthook = "2"
gitleaks = "8"

[settings]
lockfile = true
lockfile_platforms = [
  "linux-x64",
  "linux-x64-musl",
  "linux-arm64",
  "linux-arm64-musl",
  "macos-x64",
  "macos-arm64",
  "windows-x64",
]
