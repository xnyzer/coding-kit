[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
description = "{{PROJECT_DESCRIPTION}}"
readme = "README.md"
license = "{{LICENSE_SPDX}}"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9",
    "pyright>=1.1",
    "ruff>=0.17",
]
# Only for `just license-check`: not installed into .venv, the exact version is in uv.lock
licenses = [
    "pip-licenses>=5.5",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
# target-version is derived from requires-python

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
