pre-commit:
  parallel: true
  jobs:
    - name: secrets-scan
      run: gitleaks git --pre-commit --staged --redact
    - name: validate
      run: just validate
    # The script tests take a few minutes; scripts/script-tests.sh runs only the test
    # groups a staged change touches (its table is the only place that decides this).
    # CI runs all groups always (`just check-all`).
    - name: script-tests
      run: sh scripts/script-tests.sh --staged
    - name: features-index
      run: just features
      glob: "features/*"
    - name: version-rule
      run: just version-rule --staged
