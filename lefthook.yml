pre-commit:
  parallel: true
  jobs:
    - name: secrets-scan
      run: gitleaks git --pre-commit --staged --redact
    - name: validate
      run: just validate
    # The script tests take a few minutes; scripts/script-tests.sh runs them when a
    # staged change touches what they test (its path list is the only one). CI runs
    # them always (`just check-all`).
    - name: script-tests
      run: sh scripts/script-tests.sh --staged
    - name: features-index
      run: just features
      glob: "features/*"
    - name: version-rule
      run: just version-rule --staged
